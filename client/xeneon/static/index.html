<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xeneon HW Monitor</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- The shell is in the HTML so a slow script still shows Connecting, not a blank page. -->
  <div id="fit">
    <div id="stage">
      <header>
        <div class="brand"><strong>SYSTEM</strong> <span>/ OVERVIEW</span></div>
        <div id="banner" class="banner connecting">CONNECTING · waiting for the Windows host</div>
        <div class="wifi">
          <div id="wifi-ssid">Wi-Fi unavailable</div>
          <div id="wifi-detail">no provider yet</div>
          <div id="wifi-bars" class="bars"></div>
        </div>
      </header>
      <section id="cpu" class="temp-card"></section>
      <section id="gpu" class="temp-card"></section>
      <section id="mid">
        <div id="load" class="panel"></div>
        <div id="stats"></div>
        <div id="cases" class="panel"></div>
      </section>
      <section id="spotify" class="panel"></section>
      <footer id="footer">Local shell is up. Waiting for the Windows host. Graphs draw at display rate. Sensor polls stay near 1 Hz.</footer>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
